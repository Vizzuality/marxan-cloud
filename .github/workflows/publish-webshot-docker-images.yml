name: Publish Webshot Docker image

permissions:
  contents: read

on:
  push:
    branches:
      - "production"
      - "staging"
    paths:
      - ".github/**"
      - "api/**"
      - "app/**"
      - "webshot/**"
  workflow_dispatch:

jobs:
  push_webshot_to_registry:
    name: Push Webshot Docker image to Azure Container Registry
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build and push image
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_LOGIN_SERVER }}
          username: ${{ vars.REGISTRY_TOKEN_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN_PASSWORD }}

      - run: |
          docker build ./webshot \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/marxan-webshot:${{ github.sha }} \
            -t ${{ vars.REGISTRY_LOGIN_SERVER }}/marxan-webshot:${{ github.ref != 'refs/heads/production' && 'staging' || 'production' }}
          docker push -a ${{ vars.REGISTRY_LOGIN_SERVER }}/marxan-webshot
